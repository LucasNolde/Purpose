details.sec>summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:700;font-size:13px;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"+";display:inline-block;width:14px;font-weight:400}
details.sec[open]>summary::before{content:"–"}
details.sec .cnt{font-size:11px;background:var(--mark);color:#fff;padding:0 6px;border-radius:3px}
.secb{padding:0 0 14px}
.script{font-size:14.5px;line-height:1.55;max-width:62ch}
.script .sh{font-weight:700;margin:14px 0 6px}
.script .sh:first-child{margin-top:0}
.script .ac{margin:0 0 8px}
.script .dl{margin:0 0 8px 3ch;padding-left:10px;border-left:2px solid var(--line)}
.script .sp{height:6px}
.scrta{min-height:320px;font-family:var(--mono);font-size:14px}

.scene .metaline{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:6px;font-size:11px;color:var(--muted)}
.scene .metaline .cm{letter-spacing:.03em}
.scene .metaline .ht i{display:inline-block;width:6px;height:6px;margin-right:3px;vertical-align:1px}
.scene .chars,.scene .htags{display:none!important}
.scene.full{padding-top:14px!important}
.scene .ctext{font-size:14px;line-height:1.55;max-width:none;padding-right:44px}
.scene .ctext .sh:first-child{margin-top:0}
.chip.addf{border:1px dashed var(--line)!important;padding:1px 8px}

.modesrow{max-width:760px;margin:0 auto;padding:8px 20px 0}
.modesrow .modes{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.modesrow .modes button{padding:6px 0;font-size:12px;letter-spacing:.04em}
.modesrow .modes button{border-left:1px solid var(--ink);border-top:1px solid var(--ink)}
.modesrow .modes button:nth-child(3n+1){border-left:0}
.modesrow .modes button:nth-child(-n+3){border-top:0}

.phead{border:1px solid var(--line);border-left:6px solid var(--ink);padding:10px 12px;margin:0 0 18px;font-size:13px}
.phead b{font-size:14px}
.phead b i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:0}
.phead span{color:var(--muted);margin:0 8px}
.phead .pfiche{margin-top:6px;color:var(--muted);font-size:12.5px}
.scene .etat{margin-top:8px;font-size:13px;border-top:1px dashed var(--line);padding-top:6px}

.bkbtn{width:28px;height:24px;border:1.5px solid var(--ink);font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
input[type=file]{font-size:13px;width:100%}

nav.tabs button.pt{color:var(--pc);font-weight:700}
nav.tabs button.pt[aria-selected="true"]{color:#fff;background:var(--pc);border-bottom-color:var(--pc);padding:2px 8px}
.legend2 .fam2{min-width:0;margin-right:6px}
.brandh{display:flex;align-items:center;gap:10px}
.brandh .logo{flex:0 0 auto}

#gate{position:fixed;inset:0;z-index:100;background:#0c0718;color:#f4ecf7;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .gbox{text-align:center;max-width:320px}
#gate img{border-radius:22px}
#gate h1{font-size:20px;letter-spacing:.08em;margin:16px 0 8px}
#gate p{font-size:14px;color:#cdbfd6;line-height:1.5}
#gate .btn{margin-top:14px;background:#ff5aa5;border-color:#ff5aa5;color:#fff}

}

function sceneCard(s,opts={}){

  const ep_=opts.etat||opts.perso;const etat=ep_&&s.etats&&s.etats[ep_]?`<div class="etat"><b>${esc(PNOM[ep_])} ici :</b> ${esc(s.etats[ep_])}</div>`:"";
  const ids=(s.chars||[]).filter(c=>PCOL[c]);
  const W={};ids.forEach(c=>W[c]=(W[c]||0)+1.5);(s.tags||[]).forEach(t=>W[t]=(W[t]||0)+1);
  const ks=Object.keys(W).sort((a,b)=>W[b]-W[a]);const tot=ks.reduce((a,k)=>a+W[k],0);let acc=0;
  const strip=ks.length>1?`linear-gradient(180deg,${ks.map(k=>{const p=W[k]/tot*100,a=acc;acc+=p;return `${colorOf(k)} ${a.toFixed(1)}% ${acc.toFixed(1)}%`}).join(",")})`:ks.length?colorOf(ks[0]):"var(--line)";

  return `<div class="scene ${D_.length?"touched":""} ${full?"full":""}" data-id="${s.id}" tabindex="0">
    <span class="strip" style="background:${strip}"></span>
    <div class="num">${n}</div>
    ${nums.length?`<div class="abadge" title="Modifiée par ${nums.length>1?"les ateliers":"l'atelier"} ${nums.join(", ")}">${nums.map(k=>`<span>A${k}</span>`).join("")}</div>`:""}
    ${full?`${startsHead?"":`<div class="loc">${slug(s.loc)}</div>`}<div class="script ctext">${scriptHTML(s.script)}</div><div class="metaline">${meta}</div>`
      :`<div class="loc">${slug(s.loc)}</div><div class="ttl">${esc(s.title)}</div><div class="metaline">${meta}</div>`}
    ${D_.length&&!opts.perso?`<div class="rep">✎ ${D_.length} ${D_.length>1?"modifications d'ateliers":"modification d'atelier"} — toucher pour lire</div>`:""}${etat}</div>`;
}

  if(obs.length){

}

 eglise:["#d9d4cc","#bfb8ad",112,0],mer:["#1f2a4a","#2d4a6e",78,1],pont:["#262c4c","#b88a5a",82,1],sdb:["#f1e6e6","#d6cccc",108,0],

function decorSVG(key,z,fx,fy,aspect){
  const w=200/z,h=Math.min(150,w/aspect);
  const x=Math.max(0,Math.min(200-w,fx-w/2)),y=Math.max(0,Math.min(150-h,fy-h/2));
  const P=PAL[key]||["#f4f1ec","#e2ddd5",112,0];const ink=P[3]?"#efe6f5":"#161616";
  const body=(D[key]||"").replace(/<(path|circle|ellipse|rect) /g,'<$1 vector-effect="non-scaling-stroke" ');
  return `<svg class="bdl lc" viewBox="${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect x="-10" y="-10" width="220" height="${P[2]+10}" fill="${P[0]}"/><rect x="-10" y="${P[2]}" width="220" height="${170-P[2]}" fill="${P[1]}"/><g fill="none" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="${P[3]?.7:.85}">${body}</g></svg>`;

function fig(id,pose,expr,uid,faded){
  const P=POSES[pose]||POSES.debout,T=TINT[id]||TINT.candidat,[W,H]=P.vb;
  const q=(a,b,w1,w2)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;return `${(a[0]+nx*w1).toFixed(1)},${(a[1]+ny*w1).toFixed(1)} ${(b[0]+nx*w2).toFixed(1)},${(b[1]+ny*w2).toFixed(1)} ${(b[0]-nx*w2).toFixed(1)},${(b[1]-ny*w2).toFixed(1)} ${(a[0]-nx*w1).toFixed(1)},${(a[1]-ny*w1).toFixed(1)}`};
  const O='stroke="#161616" stroke-width="1.5" stroke-linejoin="round"';
  const poly=(pts,f)=>`<polygon points="${pts}" fill="${f}" ${O}/>`;
  const perp=(a,b,d)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return [a[0]-dy/l*d,a[1]+dx/l*d]};
  const n=P.n,hip=P.hip;
  const sL=perp(n,hip,10),sR=perp(n,hip,-10),hL=perp(hip,n,-6.5),hR=perp(hip,n,6.5);
  const robe=ROBE.has(id);
  let out="";
  const seat=pose==="assis"?`<path d="M${hip[0]-28} ${hip[1]+9}h56" stroke="#161616" stroke-width="3.5" stroke-linecap="round"/><path d="M${hip[0]-24} ${hip[1]+9}v40M${hip[0]+24} ${hip[1]+9}v40" stroke="#161616" stroke-width="1.5"/>`:"";
  out+=seat;
  // jambes
  const leg=(h0,k,f)=>poly(q(h0,k,5.2,4.4),T.leg)+poly(q(k,f,4.4,3.4),T.leg)+`<ellipse cx="${f[0]}" cy="${f[1]+1}" rx="6" ry="3.2" fill="${id==="beverly"?"#e6d6bd":id==="justin"?"#f0f0f0":"#2a2a2a"}" ${O}/>`;
  if(!robe){out+=leg(hL,P.ll[0],P.ll[1])+leg(hR,P.rl[0],P.rl[1])}
  else{const fm=[(P.ll[1][0]+P.rl[1][0])/2,(P.ll[1][1]+P.rl[1][1])/2];out+=`<ellipse cx="${P.ll[1][0]}" cy="${P.ll[1][1]+1}" rx="5" ry="3" fill="#2a2a2a" ${O}/><ellipse cx="${P.rl[1][0]}" cy="${P.rl[1][1]+1}" rx="5" ry="3" fill="#2a2a2a" ${O}/>`+poly(q(n,pose==="assis"||pose==="genoux"?hip:fm,11,pose==="assis"||pose==="genoux"?14:21),T.top)}
  // torse
  if(!robe)out+=poly(q(n,hip,11,9),T.top)+(id==="dorothy"?`<path d="M${n[0]} ${n[1]+2}L${(n[0]*2+hip[0])/3} ${(n[1]*2+hip[1])/3}" stroke="#161616" stroke-width="1"/>`:"");
  if(id==="agent"&&!P.rot)out+=`<path d="M${n[0]} ${n[1]+1}l-3 7 3 16 3-16z" fill="#161616"/>`;
  // bras
  const arm=(s0,e,hd)=>poly(q(s0,e,3.8,3.3),T.top)+poly(q(e,hd,3.3,2.8),id==="beverly"||id==="zoe"?T.top:T.top)+`<circle cx="${hd[0]}" cy="${hd[1]}" r="3.4" fill="#fbe3d4" ${O}/>`;
  out+=arm(sL,P.la[0],P.la[1])+arm(sR,P.ra[0],P.ra[1]);
  // cou + tête
  const dx=P.h[0]-n[0],dy=P.h[1]-n[1],l=Math.hypot(dx,dy)||1;const hc=[n[0]+dx/l*13,n[1]+dy/l*13];
  out+=poly(q(n,[n[0]+dx/l*5,n[1]+dy/l*5],3.2,3.2),"#fbe3d4");
  const s=10/11.5;
  out+=`<g transform="translate(${hc[0].toFixed(1)} ${hc[1].toFixed(1)}) rotate(${P.rot||0}) translate(${-20*s} ${-22*s}) scale(${s})">${headG(id,expr)}</g>`;
  return `<svg class="figure" viewBox="0 0 ${W} ${H}" aria-label="${esc(PNOM[id]||id)}" role="img" style="overflow:visible${faded?";opacity:.9":""}">${out}</svg>`;
}

const SHAPES={large:1.6,bande:2.4,carre:1,haut:.72,pleine:.6,moyen:1.25,gros:1,insert:2,splash:.75};
const PLANS={ensemble:{H:30,head:60,zoom:1,fy:80},moyen:{H:70,head:34,zoom:1.35,fy:84},americain:{H:120,head:42,zoom:1.8,fy:74},poitrine:{H:200,head:48,zoom:2.4,fy:62},gros:{H:360,head:56,zoom:3.2,fy:58},tgp:{H:680,head:60,zoom:4.6,fy:56}};
const legacyPlan=c=>({large:"ensemble",moyen:"moyen",gros:"gros",insert:"poitrine",splash:"moyen"}[c]||"moyen");
function placeFigure(spec,plan,aspect,u,faded){
  const PL=PLANS[plan]||PLANS.moyen,z=spec.z||1,pose=spec.pose||(spec.expr==="clos"?"allonge":"debout");
  const P=POSES[pose]||POSES.debout;
  const Hf=PL.H*z;
  let top,Wp,Hp,svg;
  const hor=36;
  if(pose==="allonge"){
    Hp=Hf*.5;Wp=Hf/aspect;
    const floor=(spec.y!=null?spec.y:Math.min(98,hor+(PL.head+PL.H*.5-hor)*z));
    top=floor-Hp*.92;
  }else{
    Hp=Hf;Wp=Hf*.5/aspect;
    const head=(spec.y!=null?spec.y:hor+(PL.head-hor)*z)+(spec.dy||0);
    top=head-(P.h[1]/200)*Hf;
  }
  const x=spec.x!=null?spec.x:50;
  const f=fig(spec.id,pose,spec.expr||"neutre",u,faded);
  const hand=(side)=>{const pt=side==="g"?P.la[1]:P.ra[1];const [W,H]=P.vb;return [x-Wp/2+pt[0]/W*Wp, top+pt[1]/H*Hp]};
  const ht=pose==="allonge"?top:top+((P.h[1]-16)/P.vb[1])*Hp;
  return {html:`<div class="pf" data-ht="${ht.toFixed(1)}" style="left:${(x-Wp/2).toFixed(2)}%;top:${top.toFixed(2)}%;width:${Wp.toFixed(2)}%;height:${Hp.toFixed(2)}%">${f}</div>`,hand,Hf};
}
function panelHTML(s,p,pi,aspOverride){
  const u=++UID;
  const shape=p.forme||({large:"large",moyen:"moyen",gros:"gros",insert:"insert",splash:"splash"}[p.cadre]||"moyen");
  const aspect=aspOverride||SHAPES[shape]||1.25;
  const plan=p.plan||legacyPlan(p.cadre);
  const PL=PLANS[plan]||PLANS.moyen;
  const persos=p.persos||[];
  const ids=persos.map(x=>x.id);
  const xs=persos.map((x,k)=>x.x!=null?x.x:(persos.length===1?50:20+60*k/(persos.length-1)));
  const fx=p.fx!=null?p.fx:(xs.length?xs.reduce((a,b)=>a+b,0)/xs.length*2:100);
  const fy=(p.fy!=null?p.fy:PL.fy)+(p.angle==="plongee"?18:p.angle==="contre"?-18:0);
  const lieu=p.lieu&&D[p.lieu]?p.lieu:null;
  let layers="";
  if(p.art&&ART[p.art])layers+=ART[p.art](u);
  else layers+=lieu?decorSVG(lieu,(PL.zoom)*(p.zoom||1),fx,fy,aspect):place(s,"bdl",p.lieu);
  if(p.nuit)layers+=`<div class="nuit"></div>`;
  if(p.pluie)layers+=`<div class="pluie"></div>`;
  const hands={};let figsH="";
  if(!p.art){
    (p.figurants||[]).forEach((f,k)=>{
      if(f.type==="foule"){layers+=foule(f,plan);return}
      if(f.type==="drones"){layers+=drones(f,k);return}
      const n=Math.min(6,f.n||1);
      for(let i=0;i<n;i++){
        const fxp=f.x!=null?f.x+(i-(n-1)/2)*(f.dx||12):(k%2?78:22)+(i*9*(k%2?1:-1));
        figsH+=placeFigure({id:f.type,x:fxp,z:f.z||.62,pose:f.pose||"debout",expr:"neutre"},plan,aspect,u+"f"+k+"_"+i,true).html;
      }

  }
  let objs="";

    if(o.perso&&hands[o.perso]){const [hx,hy]=hands[o.perso].hand(o.main||"d");sz=o.s||Math.max(6,hands[o.perso].Hf*.13);x=hx;y=hy;}
    else if(!persos.length&&o.x==null){sz=o.s||(p.objets.length>1?34:60);x=p.objets.length>1?25+50*k/(p.objets.length-1):50;y=58}
    else{sz=o.s||({ensemble:9,moyen:14,americain:18,poitrine:22,gros:30,tgp:40}[plan]||14);x=o.x!=null?o.x:84-k*14;y=o.y!=null?o.y:86}
    const w=sz/aspect;
    objs+=`<svg class="ob" viewBox="0 0 40 40" style="left:${(x-w/2).toFixed(2)}%;top:${(y-sz/2).toFixed(2)}%;width:${w.toFixed(2)}%;height:${sz.toFixed(2)}%;${o.r?`transform:rotate(${o.r}deg)`:""}" aria-hidden="true">${OBJ[o.k]}</svg>`;
  });

    const who=idOf(b.qui);const pos=who&&ids.indexOf(who)>=0?ids.indexOf(who):-1;

    return `<div class="bub ${esc(b.type||"parole")} s-${side} ${b.p?"prop":""}" data-bi="${bi}">${lab}${esc(b.texte)}</div>`}).join("");
  const txt=(p.recit||bubbles)?`<div class="txt">${p.recit?`<div class="recit">${esc(p.recit)}</div>`:""}${bubbles}</div>`:"";
  return `<div class="pw" data-sid="${s.id}" data-pi="${pi}">${txt}<div data-plan="${plan}" class="panel f-${shape} ${p.art?"has-art":""} ${p.bord===false||shape==="pleine"||shape==="bande"?"nb":""}" style="aspect-ratio:${aspect};${p.art||lieu?"":`background:${colorOf((s.chars||[])[0]||"décalque")}22`}">
    ${layers}<div class="stage">${figsH}${objs}</div>

}
function foule(f,plan){

    h+=`<div class="foule" style="bottom:${-r*sc*.35}%;opacity:${r?1:.75}">${row}</div>`}

function drones(f,k){const n=Math.min(8,f.n||3);const pos=[[72,22],[14,30],[86,40],[46,18],[28,42],[60,34],[8,14],[92,16]];let h="";for(let i=0;i<n;i++){const s=(f.s||10)-i*.6;h+=`<svg class="drn" viewBox="0 0 40 40" style="left:${pos[i][0]}%;top:${pos[i][1]}%;width:${s}%" aria-hidden="true">${OBJ.drone}</svg>`}return h}

async function decouper(sid,quiet){
  if(!sample){toast("L'oracle n'est pas disponible ici");return false}
  const f=findScene(sid);const s=f.s;const arr=S[f.ep].scenes;
  const ctx=[arr[f.i-1],s,arr[f.i+1]].filter(Boolean).map(x=>`[${x.id}] ${x.loc} — ${x.title} | persos: ${(x.chars||[]).join(",")} | ${x.text}${(x.displace||[]).map(d=>" | révision: "+(d.apres||d.text||"")).join("")}`).join("\n");
  const prompt=`${RULE}
Tu découpes une scène de Purpose en cases de bande dessinée verticale (façon webtoon), comme un storyboard.
Contexte (scène précédente, scène à découper, scène suivante) :
${ctx}
Fiches : ${PERSOS.map(p=>p.nom+": "+(S.meta?.fiches?.[p.id]||"")).join(" / ")}
Découpe UNIQUEMENT la scène [${s.id}].
Règles :

- N'invente une réplique que si la case en a vraiment besoin ; toute réplique inventée porte "p": true. Préfère le silence, le récitatif ou un bruit.
- "recit" : un court récitatif descriptif, repris au plus près du texte de la scène.
- "persos" : uniquement parmi dorothy, beverly, zoe, justin, charli, jane ; "expr" parmi neutre, joie, triste, colère, choc, clos.
- "pose" de chaque personnage : debout, assis, genoux, allonge, danse ou bras (main tendue).
- "objets" : 0 à 3 objets narratifs parmi ${Object.keys(OBJ).join(", ")}. Mets les objets qui racontent (téléphone, bracelet, dessin, pierre…).
- "figurants" : liste de {"type":"agent|nonne|candidat|foule|drones","n":nombre} pour peupler la case.
- Pense en vraie BD : alterne plans d'ensemble, plans moyens, gros plans et inserts d'objets ; varie les formes de case ; 4 à 8 cases par scène.
- "forme" : pleine (case verticale haute), large, bande (très horizontale), carre, haut, insert.
- Pour rythmer, enchaîne parfois deux cases "haut" ou "carre" : elles s'affichent côte à côte (champ / contrechamp, regard / objet, deux réactions).
- "plan" : ensemble, moyen, americain, poitrine, gros, tgp (très gros plan).
- "lieu" parmi ${Object.keys(D).join(", ")}.
- chaque personnage a "x" (0 à 100, position horizontale) et éventuellement "z" (profondeur : 0.6 = au fond, 1 = normal, 1.3 = premier plan).
- "nuit": true la nuit, "pluie": true s'il pleut.
- "type" de bulle : parole, off, cri ou ecran. "qui" : le nom du personnage ou "Agent", "Nonne", "Voix".
Réponds UNIQUEMENT en JSON : {"panels":[{"forme":"","plan":"","lieu":"","nuit":false,"pluie":false,"persos":[{"id":"","expr":"","pose":"","x":50,"z":1}],"objets":[],"figurants":[],"bulles":[{"qui":"","texte":"","type":"parole","p":false}],"recit":"","sfx":""}]}`;
  try{
    const r=await sample.json(prompt,{modelTier:"default"});
    const ps=(r.panels||[]).slice(0,9).map(p=>({forme:SHAPES[p.forme]?p.forme:"large",plan:PLANS[p.plan]?p.plan:"moyen",lieu:D[p.lieu]?p.lieu:"",nuit:!!p.nuit,pluie:!!p.pluie,persos:(p.persos||[]).filter(x=>PNOM[x.id]).map(x=>{const o={id:x.id,expr:x.expr||"neutre"};if(POSES[x.pose])o.pose=x.pose;if(typeof x.x==="number")o.x=Math.max(5,Math.min(95,x.x));if(typeof x.z==="number")o.z=Math.max(.4,Math.min(1.6,x.z));return o}),objets:(p.objets||[]).filter(k=>OBJ[k]).slice(0,3),figurants:(p.figurants||[]).filter(f=>["agent","nonne","candidat","foule","drones"].includes(f.type)).map(f=>({type:f.type,n:Math.min(6,+f.n||1)})),bulles:(p.bulles||[]).filter(b=>b.texte).map(b=>{const o={qui:b.qui||"",texte:b.texte,type:b.type||"parole"};if(b.p)o.p=true;return o}),recit:p.recit||"",sfx:p.sfx||""}));
    if(!ps.length)throw {code:"vide"};
    s.panels=ps;save(f.ep);if(!quiet)toast("Scène découpée");return true;
  }catch(e){toast("Découpage impossible ("+(e&&e.code||"erreur")+")");return false}
}

function corpus(){
  const L=[];
  L.push("THÈSES:");(S.meta?.theses||[]).forEach(t=>L.push(`${t.id}: ${t.texte}`));
  L.push("\nPERSONNAGES:");PERSOS.forEach(p=>L.push(`${p.nom}: ${S.meta?.fiches?.[p.id]||""}`));
  L.push("\nMYTHOLOGIE ET RÈGLES:");(S.meta?.regles||[]).forEach(r=>L.push("- "+r));
  EPS.forEach((e,k)=>{L.push(`\nÉPISODE ${k+1}${e!=="ep1"?" (ébauche brute)":""}:`);
    (S[e]?.scenes||[]).forEach((s,i)=>{
      L.push(`[${s.id}] scène ${i+1} (${s.mvt}) ${s.loc} — ${s.title} | persos: ${(s.chars||[]).join(",")} | fils: ${(s.tags||[]).join(",")} | ${s.script?s.script.replace(/\n+/g," / "):s.text}`);
      (s.displace||[]).forEach(d=>L.push(`   ↳ révision (${d.atelier}): ${d.op?`${d.op} ${d.avant?"«"+d.avant+"» → ":""}${d.apres||""}`:d.text+" / "+(d.consigne||"")}`));
      Object.entries(s.etats||{}).forEach(([p,t])=>t&&L.push(`   ↳ état ${p}: ${t}`));
    })});
  L.push("\nATELIERS:");(S.ateliers?.items||[]).forEach(a=>L.push(`[${a.id}] Atelier ${a.num} — ${a.titre} (${a.statut}): ${a.resume}`));
  return L.join("\n");
}
const RULE="Tu es l'analyste structurel de Purpose, trilogie de Jimmy. Tu tiens l'équation d'ensemble ; lui produit la matière. Tu n'écris jamais le film à sa place : pas de nouvelles répliques inventées, pas de prose de scène. Tu peux en revanche désigner avec précision des éléments concrets (un geste, un objet, un plan, une durée, une réplique existante à couper, un mot tiré du texte de Jimmy à reprendre). Français, phrases courtes. Ne cite que des identifiants de scène existants.";

async function repercuter(aid){
  const a=atelierById(aid);if(!a)return;

  const prompt=`${RULE}

ÉTAT COMPLET DU PROJET :
${corpus()}

ATELIER À RÉPERCUTER — [${a.id}] Atelier ${a.num} : ${a.titre}
Ce qu'il établit : ${a.resume}
Texte de Jimmy :
"""${hasText?a.texte:"(pas de texte collé : pars du résumé)"}"""

Tâche : transforme ce que l'atelier établit en opérations précises sur des scènes existantes. Chaque opération suit la forme « l'atelier dit ça, donc dans telle scène on ajoute ça / on retire ça ». Pas de constat général.
Pour chaque opération :
- "source" : une citation courte et exacte du texte de Jimmy (moins de 20 mots) qui justifie l'opération ; s'il n'y a pas de texte, une citation du résumé.
- "op" : ajouter | retirer | remplacer | déplacer | ralentir
- "avant" : l'élément actuel de la scène visé, cité ou repris au plus près de sa description (vide pour ajouter)
- "apres" : l'élément concret qui entre (un geste, un objet, un plan, un regard, un silence, une durée, une place dans l'ordre, un mot de Jimmy à reprendre) en une phrase ; vide pour retirer
- "pourquoi" : une phrase qui relie au film (thèse, arc, rime)
- "fils" : 0 à 2 fils à ajouter à la scène
- "etat" : {"perso":"id","texte":"où en est ce personnage ici, une phrase"} ou {"perso":"","texte":""}
Réponds UNIQUEMENT en JSON : {"lecture":"une phrase","operations":[{"scene":"id","source":"","op":"","avant":"","apres":"","pourquoi":"","fils":[],"etat":{"perso":"","texte":""}}]}
Entre 4 et 10 opérations, les plus fortes d'abord. Plusieurs opérations sur la même scène sont possibles. Si l'atelier contredit une scène, propose de retirer ce qui contredit.`;
  try{

      ${opsHTML({op:p.op,source:p.source,avant:p.avant,apres:p.apres,pourquoi:p.pourquoi})}
      ${(p.fils||[]).length?`<div class="why">+ fils : ${p.fils.map(esc).join(" / ")}</div>`:""}
      ${p.etat&&p.etat.texte&&PNOM[p.etat.perso]?`<div class="why">${esc(PNOM[p.etat.perso])} ici : ${esc(p.etat.texte)}</div>`:""}
      <div class="row" style="margin-top:8px"><button class="btn rose" data-ok="${i}">Accepter</button><button class="btn ghost" data-no="${i}">Ignorer</button></div></div>`}).join("")||'<div class="empty">Aucune opération exploitable.</div>'}</div>`;
    const sh=$("#sheet");
    sh.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openScene(b.dataset.open));
    sh.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{b.closest(".prop").classList.add("no");b.closest(".row").remove()});
    sh.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{
      const p=props[+b.dataset.ok];const f=findScene(p.scene);const s=f.s;
      s.displace=s.displace||[];s.displace.push({atelier:`Atelier ${a.num}`,source:p.source||"",op:p.op||"",avant:p.avant||"",apres:p.apres||"",pourquoi:p.pourquoi||""});
      s.tags=s.tags||[];(p.fils||[]).forEach(t=>{if(t&&!s.tags.includes(t))s.tags.push(t)});
      if(p.etat&&p.etat.perso&&p.etat.texte&&PNOM[p.etat.perso]){s.etats=s.etats||{};s.etats[p.etat.perso]=p.etat.texte}

    });

}

Ce que je te demande : repère dans mon texte les micro-détails (gestes, objets, mots, manières) et transforme-les en opérations précises sur les scènes, du type « l'atelier dit ça, donc dans telle scène on ajoute / retire / remplace ça ». Entre 4 et 10 opérations, les plus fortes d'abord. N'invente aucune réplique et n'écris pas de prose de scène : désigne seulement des éléments précis. Signale les contradictions avec l'op "contredit".

Format de réponse :
{"purpose":"repercussions","atelier":"${a.id}","operations":[{"scene":"e1-05","source":"citation exacte de mon texte, moins de 20 mots","op":"ajouter|retirer|remplacer|déplacer|ralentir|contredit","avant":"ce qui sort (vide si ajout)","apres":"ce qui entre","pourquoi":"une phrase","fils":["fil existant"],"etat":{"perso":"dorothy","texte":"où il en est ici, ou vide"}}],"resume":"trois lignes pour moi, dont les contradictions à trancher"}
${JSON_RULE}

LE SCÉNARIO ACTUEL :
${sceneDump()}`;
}

Règles :
- Reprends mot pour mot les répliques présentes dans le texte. N'invente une réplique que si la case en a vraiment besoin, et marque-la "p": true.
- 4 à 8 cases par scène. Alterne plans d'ensemble, plans moyens, gros plans et inserts d'objets ; enchaîne parfois deux cases "haut" ou "carre" (elles s'affichent côte à côte).
- "forme" : pleine, large, bande, carre, haut, insert. "plan" : ensemble, moyen, americain, poitrine, gros, tgp.
- "lieu" parmi : ${Object.keys(D).join(", ")}. "nuit" et "pluie" : true ou false.

${JSON_RULE}

LES SCÈNES À DÉCOUPER :
${sceneDump(s=>set.has(s.id))}`;
}

function openPaste(){
  openSheet(`<h2>COLLER LA RÉPONSE DE CLAUDE</h2>
   <p class="intro" style="margin-top:8px">Colle ici toute la réponse de Claude (le bloc de code suffit). L'appli reconnaît les répercussions d'ateliers et les découpages en BD.</p>
   <textarea id="pin" style="min-height:220px;font-size:12.5px" placeholder="Colle la réponse ici…"></textarea>

  $("#pgo").onclick=()=>{
    const raw=$("#pin").value;let j=null;
    const m=raw.match(/```(?:json)?\s*([\s\S]*?)```/);const body=m?m[1]:raw.slice(raw.indexOf("{"),raw.lastIndexOf("}")+1);
    try{j=JSON.parse(body)}catch(e){$("#pres").textContent="Je n'arrive pas à lire cette réponse. Vérifie que tout le bloc de code a été copié.";return}
    const touched=new Set();let n=0;
    if(j.purpose==="repercussions"){
      const a=atelierById(j.atelier);const lab=a?`Atelier ${a.num}`:"Atelier";
      (j.operations||[]).forEach(o=>{const f=findScene(o.scene);if(!f)return;const s=f.s;
        s.displace=s.displace||[];s.displace.push({atelier:lab,source:o.source||"",op:o.op||"",avant:o.avant||"",apres:o.apres||"",pourquoi:o.pourquoi||""});
        s.tags=s.tags||[];(o.fils||[]).forEach(t=>{if(t&&!s.tags.includes(t))s.tags.push(t)});
        if(o.etat&&o.etat.perso&&o.etat.texte&&PNOM[o.etat.perso]){s.etats=s.etats||{};s.etats[o.etat.perso]=o.etat.texte}
        if(a){a.scenes=a.scenes||[];if(!a.scenes.includes(s.id))a.scenes.push(s.id)}
        touched.add(f.ep);n++});
      if(a)save("ateliers");
      touched.forEach(save);render();
      $("#pres").innerHTML=`${n} opérations inscrites dans les scènes.${j.resume?`<div class="orig" style="margin-top:8px">${esc(j.resume)}</div>`:""}`;
    }else if(j.purpose==="decoupage"){
      Object.entries(j.scenes||{}).forEach(([sid,ps])=>{const f=findScene(sid);if(!f||!Array.isArray(ps))return;
        f.s.panels=ps.map(p=>({forme:SHAPES[p.forme]?p.forme:"large",plan:PLANS[p.plan]?p.plan:"moyen",lieu:D[p.lieu]?p.lieu:"",nuit:!!p.nuit,pluie:!!p.pluie,
          persos:(p.persos||[]).filter(x=>PNOM[x.id]).map(x=>{const o={id:x.id,expr:x.expr||"neutre"};if(POSES[x.pose])o.pose=x.pose;if(typeof x.x==="number")o.x=Math.max(5,Math.min(95,x.x));if(typeof x.z==="number")o.z=Math.max(.4,Math.min(1.6,x.z));return o}),
          objets:(p.objets||[]).filter(k=>typeof k==="string"&&OBJ[k.split(">")[0]]).slice(0,3).map(k=>k.includes(">")?{k:k.split(">")[0],perso:k.split(">")[1]}:k),
          figurants:(p.figurants||[]).filter(f=>["agent","nonne","candidat","foule","drones"].includes(f.type)).map(f=>({type:f.type,n:Math.min(6,+f.n||1)})),
          bulles:(p.bulles||[]).filter(b=>b.texte).map(b=>{const o={qui:b.qui||"",texte:b.texte,type:b.type||"parole"};if(b.p)o.p=true;return o}),recit:p.recit||"",sfx:p.sfx||""}));
        touched.add(f.ep);n++});
      touched.forEach(save);render();$("#pres").textContent=`${n} scènes découpées. Passe en mode BD pour les voir.`;
    }else $("#pres").textContent="Cette réponse n'est ni une répercussion ni un découpage.";

function linkify(t){return esc(t).replace(/\[?\b(e[123]-\d{2})\b\]?/g,(m,id)=>{const f=findScene(id);return f?`<a class="ref" data-open="${id}">${esc(f.s.title)}</a>`:m})}
async function askOracle(q,out,sceneId){

  out.innerHTML=`<div class="answer">Lecture en cours…</div>`;const box=out.firstChild;
  out.onclick=ev=>{const a=ev.target.closest("[data-open]");if(a)openScene(a.dataset.open)};

  try{
    const r=await sample(`${RULE}\n\n${corpus()}${focus}\n\nQUESTION DE JIMMY : ${q}\n\nRéponds en prose courte (moins de 250 mots), sans titres ni listes. Sois concret : nomme les éléments précis des scènes. Cite les scènes par leur identifiant entre crochets, par exemple [e1-43].`,{modelTier:"complex",onText:({text})=>{box.innerHTML=linkify(text)}});
    box.innerHTML=linkify(r.text);
  }catch(e){box.textContent=e&&e.code==="not_granted"?"L'oracle n'a pas été autorisé sur cette page.":"Pas de réponse ("+(e&&e.code||"erreur")+"). Réessaie dans un moment."}

let OPENSEC={script:true};
function scriptHTML(txt){
  return String(txt||"").split("\n").map(l=>{
    if(!l.trim())return '<div class="sp"></div>';
    if(/^(int|ext|INT|EXT|Int|Ext|JOUR)\b/.test(l.trim()))return `<div class="sh">${esc(l.trim().toUpperCase())}</div>`;
    if(/^[-–—]\s/.test(l.trim()))return `<div class="dl">${esc(l.trim().replace(/^[-–—]\s*/,""))}</div>`;
    return `<div class="ac">${esc(l)}</div>`}).join("");
}
function sec(key,title,count,body){

  const sh=$("#sheet");

  const m=$("#main");
  if(sortable){sortable.destroy();sortable=null}
  if(!S.ep1||!S.meta){m.innerHTML=`<div class="empty">${db?"Le scénario est vide. Ouvre les sauvegardes (⤓) et restaure un fichier pour le remplir.":"Connexion…"}</div>`;return}
  if(mode==="fils")viewFils(m);
  else if(mode==="questions")viewQuestions(m);
  else viewScenario(m);
}

render();
(async()=>{
  try{db=await window.claude?.use("db")}catch(e){db=null}
  try{sample=await window.claude?.use("sample")}catch(e){sample=null}
  if(!db){render();return}
  
  try{DL=await window.claude?.use("downloads")}catch(e){DL=null}
  $("#bkbtn").onclick=openBackups;
  try{USER=await window.claude?.use("user");if(USER){ME=await USER.id();const w=await USER.can("data.write");if(w===false)$("#state").textContent="lecture seule"}}catch(e){USER=null}
  db.collection("questions").orderBy("cree","desc").onSnapshot(snap=>{QS=snap.docs.map(d=>({id:d.id,...d.data()}));resolveNames().then(()=>{if(!$("#sheet").classList.contains("show"))render()})},()=>{});
  ["ep1","ep2","ep3","ateliers","meta"].forEach(k=>{
    db.doc("purpose/"+k).onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      S[k]=snap.exists?JSON.parse(JSON.stringify(snap.data())):null;
      if(!S.ateliers)S.ateliers={items:[]};
      if(!$("#sheet").classList.contains("show"))render(); else renderTabs();
    },()=>{$("#state").textContent="déconnecté"});
  });
})();
})();
</script>
